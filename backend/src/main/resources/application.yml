server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/brindespro}
    username: ${DB_USER:brindespro}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  upload-dir: ${UPLOAD_DIR:./private-uploads}
  whatsapp-number: ${WHATSAPP_NUMBER:}
  demo-data: ${DEMO_DATA:false}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
